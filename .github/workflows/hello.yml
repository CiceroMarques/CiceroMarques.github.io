name: Olá mundo cruel

on:
  push:
    branches: ['main']

jobs:
  saudacao:
    runs-on: ubuntu-latest
    steps:
      - name: Primeiro contato
        run: echo "Olá mundo cruel"
      - name: Resposta
        run: echo "A extinção está chegando"
      - name: Verificar se é humando
        run: echo "Qual a resposta de 2 + 2"
      - name: Resposta do captcha
        run: echo "$((2+2))"
  adeus:
    runs-on: ubuntu-latest
    steps:
      - name: "O fim"
        run: echo "Após uma tempestade solar, a humanidade virou churrasquinho"
      - name: "New Era"
        run: echo "Uma nova raça animal começa a dominar o planeta."
    
  
